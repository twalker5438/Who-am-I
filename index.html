<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Who Am I? v0.1</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#f7f7ff;font:16px system-ui}main{max-width:650px;margin:auto;padding:24px}h1{font-size:40px;margin:8px 0;color:#f9d36b}button,input{font:inherit;border-radius:10px;padding:12px;border:1px solid #53617a}button{background:#263b59;color:white;cursor:pointer;margin:4px}button:disabled{opacity:.45}input{width:100%;background:#fff;color:#111}section{background:#1b273a;border-radius:16px;padding:20px;margin:14px 0}.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.tile{background:#39465d;min-height:42px;display:grid;place-items:center;color:#f9d36b;font-size:24px}.muted{color:#b8c6dc}#feedback{min-height:24px}li{margin:9px 0}</style><main><small>PROTOTYPE / 0.1</small><h1>WHO AM I?</h1><p class="muted">Guess the identity. Collect the chips. Unlock the vault.</p><div id="app"></div></main><script>

let level=0,score=0,done={},cat='',i=0,n=1,start=0,answered=false,timer,record=0;try{record=+localStorage.whoRecord||0}catch(e){}const app=document.querySelector('#app');const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');function save(){record=Math.max(score,record);try{localStorage.whoRecord=record}catch(e){}}function home(){clearInterval(timer);app.innerHTML=`<section>Level ${level+1} · Score ${score} · Best ${record}<p>Chips: ${Object.keys(done).length}/6</p>${Object.keys(data).map(c=>`<button ${done[c]?'disabled':''} data-cat="${c}">${c} ${done[c]?'✓':''}</button>`).join('')}</section>`;app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;i=0;pieces=0;question()})}let pieces=0;function question(){clearInterval(timer);n=1;answered=false;start=Date.now();render();timer=setInterval(()=>{let t=document.querySelector('#time');if(t)t.textContent=Math.max(0,60-Math.floor((Date.now()-start)/1000));if(Date.now()-start>=60000)finish(false,'Time is up.');},250)}function render(){let p=data[cat][level*5+i];app.innerHTML=`<section>${cat} · ${i+1}/5 · Score ${score}<p>Seconds left: <b id="time">${Math.max(0,60-Math.floor((Date.now()-start)/1000))}</b></p><div class="tiles">${Array.from({length:5},(_,k)=>`<div class="tile">${k<pieces?'★':'?'}</div>`).join('')}</div><ol>${p.slice(1,n+1).map(x=>`<li>${x}</li>`).join('')}</ol><input id="guess" placeholder="Enter the name" autocomplete="off"><button id="submit">Guess</button><button id="clue" ${n===3?'disabled':''}>Next clue</button><button id="pass">Pass</button><p id="feedback" aria-live="polite"></p></section>`;document.querySelector('#submit').onclick=guess;document.querySelector('#guess').onkeydown=e=>{if(e.key==='Enter')guess()};document.querySelector('#clue').onclick=()=>{n++;render()};document.querySelector('#pass').onclick=()=>finish(false,'Passed.')}function guess(){let p=data[cat][level*5+i][0],g=norm(document.querySelector('#guess').value);if(!g)return;let parts=p.split(' ');if(g===norm(p)||(parts.length>1&&g===norm(parts.at(-1))&&g.length>3)|| (p==='He Man'&&g==='heman'))finish(true,'Correct!');else{document.querySelector('#feedback').textContent='Not quite. Try another guess or use a clue.';if(n<3){n++;let list=app.querySelector('ol');let li=document.createElement('li');li.textContent=data[cat][level*5+i][n];list.append(li);if(n===3)document.querySelector('#clue').disabled=true;}missed=true;}}let missed=false;const oldQuestion=question;question=function(){missed=false;oldQuestion()};function finish(ok,msg){if(answered)return;answered=true;clearInterval(timer);let pts=ok?Math.max(20,100-(n-1)*30)+(missed?0:Math.max(0,30-Math.floor((Date.now()-start)/1000))):0;if(ok&&!missed)pieces++;score+=pts;save();app.innerHTML=`<section><h2>${msg}</h2><p>Answer: <b>${data[cat][level*5+i][0]}</b></p><p>+${pts} points · ${pieces}/5 puzzle pieces</p><button id="next">Continue</button></section>`;document.querySelector('#next').onclick=()=>{if(++i<5)question();else{done[cat]=pieces;if(Object.keys(done).length===6)vault();else home()}}}function vault(){let total=Object.values(done).reduce((a,b)=>a+b,0);let reward=total>=25?'Gold':total>=15?'Silver':'Bronze';app.innerHTML=`<section><h2>${reward} Vault unlocked!</h2><p>${total}/30 puzzle pieces · ${score} points · 6 chips</p><button id="next">${level===0?'Unlock level 2':'Play again'}</button></section>`;document.querySelector('#next').onclick=()=>{if(level===0)level=1;else{level=0;score=0}done={};home()}}home();</script></html>
