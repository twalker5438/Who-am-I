let level=0,score=0,done={},cat='',i=0,n=1,start=0,answered=false,timer,record=0;try{record=+localStorage.whoRecord||0}catch(e){}const app=document.querySelector('#app');const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');function save(){record=Math.max(score,record);try{localStorage.whoRecord=record}catch(e){}}function home(){clearInterval(timer);app.innerHTML=`<section>Level ${level+1} · Score ${score} · Best ${record}<p>Chips: ${Object.keys(done).length}/6</p>${Object.keys(data).map(c=>`<button ${done[c]?'disabled':''} data-cat="${c}">${c} ${done[c]?'✓':''}</button>`).join('')}</section>`;app.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;i=0;pieces=0;question()})}let pieces=0;function question(){clearInterval(timer);n=1;answered=false;start=Date.now();render();timer=setInterval(()=>{let t=document.querySelector('#time');if(t)t.textContent=Math.max(0,60-Math.floor((Date.now()-start)/1000));if(Date.now()-start>=60000)finish(false,'Time is up.');},250)}function render(){let p=data[cat][level*5+i];app.innerHTML=`<section><h2 class="category-title">${cat}</h2><div class="round-meta">Question ${i+1}/5 · Score ${score}</div><p>Seconds left: <b id="time">${Math.max(0,60-Math.floor((Date.now()-start)/1000))}</b></p><div class="tiles">${Array.from({length:5},(_,k)=>`<div class="tile">${k<pieces?'★':'?'}</div>`).join('')}</div><ol>${p.slice(1,n+1).map(x=>`<li>${x}</li>`).join('')}</ol><input id="guess" placeholder="Enter the name" autocomplete="off"><button id="submit">Guess</button><button id="clue" ${n===3?'disabled':''}>Next clue</button><button id="pass">Pass</button><p id="feedback" aria-live="polite"></p></section>`;document.querySelector('#submit').onclick=guess;document.querySelector('#guess').onkeydown=e=>{if(e.key==='Enter')guess()};document.querySelector('#clue').onclick=()=>{n++;render()};document.querySelector('#pass').onclick=()=>finish(false,'Passed.')}function guess(){let p=data[
